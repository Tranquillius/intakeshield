name: Bug report
description: Unexpected behaviour in IntakeShield
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do **not** include data from a live helpdesk (e-mail addresses, ticket content, logs).
        Security issues belong in a [private advisory](https://github.com/Tranquillius/intakeshield/security/advisories/new).
  - type: input
    id: intakeshield_version
    attributes:
      label: IntakeShield version
      placeholder: "0.5.0"
    validations:
      required: true
  - type: input
    id: zammad_version
    attributes:
      label: Zammad version
      placeholder: "7.x"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Generic steps only. No instance URLs, customer domains, or production logs.
    validations:
      required: true
